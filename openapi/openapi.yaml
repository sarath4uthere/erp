openapi: 3.0.3

info:
  title: Mini-ERP API
  version: 0.1.0
  description: |
    Contract-first API for the Mini-ERP. This file is the authoritative definition;
    the implementation must conform to it and CI enforces linting plus (from Phase 1)
    contract tests. All errors use RFC 7807 problem details. Money and quantities are
    JSON strings, never numbers (ADR-0004). Every list endpoint is paginated with a
    server-enforced maximum page size (ADR-0007).
  contact:
    name: Mini-ERP maintainers
    url: https://example.invalid/mini-erp

servers:
  - url: http://localhost:8080
    description: Local development API
  - url: /
    description: Same-origin deployment behind the SPA reverse proxy

tags:
  - name: System
    description: Liveness and readiness. Anonymous by design and contains no business data.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - System
      summary: Read API health
      description: |
        Anonymous liveness/readiness probe used by containers and uptime checks.
        Returns only a status and timestamp; dependency details and secrets are never
        exposed. This operation is explicitly exempt from authentication.
      security: []
      responses:
        "200":
          description: The API and its registered checks are healthy.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more registered checks are unhealthy.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived (maximum 15 minutes) access token held in SPA memory only.
        The refresh token is an HttpOnly cookie scoped to /api/auth and is never
        available to JavaScript (ADR-0002).
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-erp_rt
      description: |
        Rotating, HttpOnly, Secure, SameSite=Strict refresh cookie used only by
        POST /api/auth/refresh and POST /api/auth/logout (ADR-0002).

  headers:
    CorrelationId:
      description: Correlation identifier echoed from the request or generated by the API.
      schema:
        type: string
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
    ETag:
      description: Opaque rowversion used with If-Match for optimistic concurrency.
      schema:
        type: string

  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size. Values above 100 are rejected or clamped server-side.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Required on creates that post financial documents. Replaying the same key with
        the same payload returns the original response; a different payload returns 409.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: "^[A-Za-z0-9._:-]+$"
    IfMatch:
      name: If-Match
      in: header
      description: Required on mutations of versioned resources; stale values return 412.
      required: true
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - Healthy
            - Unhealthy
        timestamp:
          type: string
          format: date-time
          description: Server time in UTC.

    ProblemDetails:
      type: object
      description: RFC 7807/9457 problem details with ERP extensions.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type URI.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Safe, human-readable explanation. Never contains stack traces or SQL.
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          maxLength: 64
          description: Matches the X-Correlation-ID response header and structured logs.
        code:
          type: string
          description: Stable machine-readable error code for client branching.
        errors:
          type: object
          description: Field-level validation errors keyed by JSON path or property name.
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Problem:
      description: Problem details for the failure.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequest:
      description: Request validation failed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Authenticated but not permitted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: The resource does not exist, or the caller may not know that it exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: State conflict, illegal transition, duplicate idempotency key, or uniqueness violation.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionFailed:
      description: If-Match did not match the current rowversion.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionRequired:
      description: The mutation requires an If-Match precondition.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
